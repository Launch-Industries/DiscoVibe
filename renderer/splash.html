<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>DiscoVibe</title>
<style>
  /* LIDS type. PP Formula Condensed Black for the wordmark, Instrument Sans for
     everything else — both from launch-shared/registry/fonts/lids. */
  @font-face {
    font-family: "PP Formula Condensed";
    src: url("fonts/lids/PPFormula-CondensedBlack.otf") format("opentype");
    font-weight: 900; font-style: normal; font-display: block;
  }
  @font-face {
    font-family: "Instrument Sans";
    src: url("fonts/lids/InstrumentSans-Variable-latin.woff2") format("woff2");
    font-weight: 400 700; font-style: normal; font-display: block;
  }

  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }

  /* Full screen: no rounded corners or edge, and everything below scales with
     the viewport so it reads the same on a laptop and a 32" display. */
  #splash {
    position: relative;
    width: 100vw; height: 100vh;
    overflow: hidden;
    /* --chrome-bg from the main window, so the handoff has no colour step. */
    background: #04050f;
    font-family: "Instrument Sans", ui-sans-serif, system-ui, sans-serif;
  }

  /* Doug is drawn on a flat black field. Screen blending drops that black to the
     background exactly, so there is no panel edge to hide. */
  #art {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    object-fit: cover; object-position: 62% 45%;
    mix-blend-mode: screen;
  }
  #scrim {
    position: absolute; inset: 0;
    background: linear-gradient(100deg, #04050f 26%, rgba(4,5,15,.88) 44%, rgba(4,5,15,0) 70%);
  }

  #copy {
    position: absolute;
    left: clamp(40px, 6vw, 150px);
    top: 50%; transform: translateY(-50%);
    display: flex; flex-direction: column;
    gap: clamp(14px, 1.6vh, 30px);
    max-width: 46vw;
  }
  #rule { display: flex; gap: clamp(5px, .5vw, 10px); }
  #rule span { width: clamp(30px, 3.4vw, 72px); height: clamp(5px, .55vh, 11px); border-radius: 4px; }

  #mark {
    font-family: "PP Formula Condensed", "Instrument Sans", system-ui, sans-serif;
    font-weight: 900;
    font-size: clamp(56px, 8.4vw, 190px);
    line-height: .94;
    letter-spacing: .2px;
    color: #ffffff;
  }
  #tag { font-size: clamp(14px, 1.5vw, 32px); line-height: 1.4; color: #8890b8; }

  #foot {
    position: absolute;
    left: clamp(40px, 6vw, 150px);
    bottom: clamp(40px, 6vh, 96px);
    display: flex; flex-direction: column; gap: clamp(12px, 1.4vh, 22px);
  }
  #track { width: clamp(148px, 15vw, 320px); height: clamp(3px, .35vh, 6px); border-radius: 4px; background: rgba(136,144,184,.22); overflow: hidden; }
  #bar { width: 24%; height: 100%; border-radius: 3px; background: #51D9DD; animation: sweep 1.6s ease-in-out infinite; }
  @keyframes sweep { 0% { transform: translateX(-100%); } 100% { transform: translateX(420%); } }
  #org { display: flex; align-items: baseline; gap: clamp(8px, .8vw, 16px); }
  #org b { font-size: clamp(11px, 1.05vw, 20px); font-weight: 600; letter-spacing: .9px; text-transform: uppercase; color: #dde2f2; }
  #org span { font-size: clamp(11px, 1.05vw, 20px); color: #4f5763; }

  @media (prefers-reduced-motion: reduce) { #bar { animation: none; width: 100%; } }
</style>
</head>
<body>
  <div id="splash">
    <img id="art" src="splash/doug.jpg" alt="">
    <div id="scrim"></div>

    <div id="copy">
      <div id="rule">
        <span style="background:#F9465C"></span>
        <span style="background:#FFD100"></span>
        <span style="background:#51D9DD"></span>
      </div>
      <div id="mark">DiscoVibe</div>
      <div id="tag">Tiled terminals for vibe coders</div>
    </div>

    <div id="foot">
      <div id="track"><div id="bar"></div></div>
      <div id="org"><b>Launch Industries</b><span id="ver"></span></div>
    </div>
  </div>
  <script>
    // Version is appended by main via the query string, so the splash never
    // carries a hardcoded number that can drift from package.json.
    const v = new URLSearchParams(location.search).get('v');
    if (v) document.getElementById('ver').textContent = 'v' + v;
  </script>
</body>
</html>
